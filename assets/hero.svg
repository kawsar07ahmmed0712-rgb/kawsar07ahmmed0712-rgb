<svg width="1200" height="500" viewBox="0 0 1200 500" fill="none" xmlns="http://www.w3.org/2000/svg">
<defs>
  <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="500">
    <stop stop-color="#FFFFFF"/>
    <stop offset=".42" stop-color="#F8FAFF"/>
    <stop offset="1" stop-color="#FFF8FC"/>
  </linearGradient>

  <linearGradient id="accent" x1="345" y1="0" x2="855" y2="0">
    <stop stop-color="#38BDF8"/>
    <stop offset=".28" stop-color="#6366F1"/>
    <stop offset=".56" stop-color="#A855F7"/>
    <stop offset=".78" stop-color="#EC4899"/>
    <stop offset="1" stop-color="#FB7185"/>
  </linearGradient>

  <radialGradient id="blueBlob">
    <stop stop-color="#BAE6FD" stop-opacity=".92"/>
    <stop offset="1" stop-color="#BAE6FD" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="purpleBlob">
    <stop stop-color="#E9D5FF" stop-opacity=".95"/>
    <stop offset="1" stop-color="#E9D5FF" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="pinkBlob">
    <stop stop-color="#FCE7F3" stop-opacity=".95"/>
    <stop offset="1" stop-color="#FCE7F3" stop-opacity="0"/>
  </radialGradient>

  <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
    <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#64748B" flood-opacity=".14"/>
  </filter>

  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>
</defs>

<rect width="1200" height="500" rx="34" fill="url(#heroBg)"/>
<rect x="1" y="1" width="1198" height="498" rx="33" stroke="#E2E8F0" stroke-width="2"/>

<!-- ambient pastel shapes -->
<ellipse cx="80" cy="45" rx="260" ry="210" fill="url(#blueBlob)" filter="url(#soft)"/>
<ellipse cx="1110" cy="70" rx="260" ry="220" fill="url(#purpleBlob)" filter="url(#soft)"/>
<ellipse cx="1020" cy="460" rx="280" ry="180" fill="url(#pinkBlob)" filter="url(#soft)"/>

<!-- subtle decorative dots -->
<g fill="#CBD5E1" opacity=".6">
  <circle cx="78" cy="89" r="3"/><circle cx="96" cy="89" r="3"/><circle cx="114" cy="89" r="3"/>
  <circle cx="1086" cy="416" r="3"/><circle cx="1104" cy="416" r="3"/><circle cx="1122" cy="416" r="3"/>
</g>

<!-- glass-ish top label -->
<g filter="url(#shadow)">
  <rect x="433" y="50" width="334" height="42" rx="21" fill="#FFFFFF" fill-opacity=".92" stroke="#E2E8F0"/>
</g>
<circle cx="460" cy="71" r="5.5" fill="#22C55E"/>
<text x="610" y="76" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" letter-spacing="2.1" fill="#475569">
  AI ENGINEERING • PORTFOLIO
</text>

<!-- main -->
<text x="600" y="192" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
      font-size="72" font-weight="800" letter-spacing="4.2" fill="#0F172A">KAWSAR AHMMED</text>

<rect x="355" y="216" width="490" height="5" rx="2.5" fill="url(#accent)"/>

<text x="600" y="273" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
      font-size="24" font-weight="700" letter-spacing="4.4" fill="#334155">
  AI / MACHINE LEARNING ENGINEER
</text>

<text x="600" y="317" text-anchor="middle" font-family="Arial,Helvetica,sans-serif"
      font-size="15.5" font-weight="500" fill="#64748B">
  Research-driven machine learning, deep learning, RAG and agentic AI systems
</text>

<!-- chips -->
<g font-family="Arial,Helvetica,sans-serif" font-size="11.5" font-weight="700">
  <rect x="238" y="354" width="139" height="34" rx="17" fill="#E0F2FE" stroke="#7DD3FC"/>
  <text x="307.5" y="376" text-anchor="middle" fill="#0369A1">MACHINE LEARNING</text>

  <rect x="389" y="354" width="124" height="34" rx="17" fill="#EEF2FF" stroke="#A5B4FC"/>
  <text x="451" y="376" text-anchor="middle" fill="#4338CA">DEEP LEARNING</text>

  <rect x="525" y="354" width="111" height="34" rx="17" fill="#F3E8FF" stroke="#D8B4FE"/>
  <text x="580.5" y="376" text-anchor="middle" fill="#7E22CE">AGENTIC AI</text>

  <rect x="648" y="354" width="77" height="34" rx="17" fill="#DCFCE7" stroke="#86EFAC"/>
  <text x="686.5" y="376" text-anchor="middle" fill="#15803D">RAG</text>

  <rect x="737" y="354" width="225" height="34" rx="17" fill="#FFF7ED" stroke="#FDBA74"/>
  <text x="849.5" y="376" text-anchor="middle" fill="#C2410C">DATA • ANALYTICS • CV</text>
</g>

<!-- workflow -->
<text x="600" y="450" text-anchor="middle" font-family="Courier New,monospace"
      font-size="13.5" font-weight="700" letter-spacing="1.5" fill="#94A3B8">
  RESEARCH  →  EXPERIMENT  →  VALIDATE  →  ENGINEER  →  DEPLOY
</text>
</svg>